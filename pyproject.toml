[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afl-predictor"
version = "0.1.0"
description = "AFL match data loader and ML predictor for Footballista API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "numpy>=2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "lightgbm>=4.4",
    "optuna>=3.5",
    "matplotlib>=3.8",
]

[project.scripts]
afl-list = "afl_predictor.scripts.list_leagues:main"
afl-fetch = "afl_predictor.scripts.fetch_matches:main"
afl-train = "afl_predictor.scripts.train_model:main"
afl-predict = "afl_predictor.scripts.predict_match:main"
afl-teams = "afl_predictor.scripts.export_teams:main"

[tool.setuptools.packages.find]
where = ["src"]
